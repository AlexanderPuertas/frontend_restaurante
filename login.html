<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurante - Reservas & Acceso</title>

    <script>
        // Si ya hay sesión activa, redirige según el rol guardado
        try {
            const sesionGuardada = localStorage.getItem('usuarioRestaurante') || localStorage.getItem('usuarioSena');
            if (sesionGuardada) {
                window.location.replace('mesas.html');
            }
        } catch (e) {
            console.error("Error al leer sesión previa:", e);
        }
    </script>

    <!-- Google Fonts (Serif de lujo y fuente moderna para interfaz) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="./css/estilologin.css">
</head>

<body>
    <!-- FONDO CON OVERLAY AMBIENTAL OSCURO -->
    <div class="bg-overlay"></div>

    <main class="page-container">
        <!-- CABECERA PRINCIPAL ESTILO SERATTA -->
        <header class="restaurant-header">
            <div class="badge-group">GRUPO GASTRONÓMICO</div>
            <div class="kicker-text">ALTA COCINA MEDITERRÁNEA</div>
            <h1 class="brand-title">Restaurante</h1>
            <p class="brand-subtitle">El emblema del sabor · Reservas y gestión centralizada</p>
        </header>

        <!-- TARJETA FLOTANTE CENTRAL OSCURA -->
        <section class="login-card">
            <!-- MENSAJE DE ERROR O INFO -->
            <div id="mensajeError" class="mensaje-error" style="display: none;">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span id="textoError"></span>
            </div>

            <!-- FORMULARIO DE ACCESO -->
            <form id="loginForm" novalidate>
                <!-- SECCIÓN: CORREO ELECTRÓNICO -->
                <div class="form-group">
                    <label for="t1" class="field-label">
                        <i class="fa-solid fa-envelope"></i> TU CORREO
                    </label>
                    <div class="input-wrapper">
                        <input type="email" id="t1" name="t1" placeholder="nombre@correo.com" autocomplete="email" required autofocus>
                    </div>
                    <p class="micro-note">
                        Con esto te reconocemos y cargamos tus datos automáticamente ✨
                    </p>
                </div>

                <!-- SECCIÓN: CONTRASEÑA -->
                <div class="form-group">
                    <label for="t2" class="field-label">
                        <i class="fa-solid fa-lock"></i> CONTRASEÑA
                    </label>
                    <div class="input-wrapper">
                        <input type="password" id="t2" name="t2" placeholder="••••••••" autocomplete="current-password" required>
                        <button type="button" id="btnTogglePassword" class="btn-toggle-eye" title="Mostrar/ocultar contraseña" tabindex="-1">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- BOTÓN PRINCIPAL DE ACCESO -->
                <button type="submit" class="btn-submit" id="btnSubmit">
                    <i class="fa-solid fa-right-to-bracket"></i>
                    <span>Iniciar Sesión</span>
                </button>
            </form>

            <!-- ENLACE DE REGISTRO NUEVO CLIENTE -->
            <div class="registro-box">
                <span>¿Aún no tienes cuenta?</span>
                <a href="nuevocliente.html">
                    <i class="fa-solid fa-user-plus"></i> Crear cuenta de cliente
                </a>
            </div>

            <!-- FOOTER -->
            <footer class="card-footer">
                Alexander Puertas (SENA) © 2026
            </footer>
        </section>
    </main>

    <!-- LÓGICA JAVASCRIPT CON AUTODETECCIÓN DE ROL -->
    <script src="./js/jslogin.js?v=2"></script>
</body>

</html>
